[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbi-tt-rates"
version = "0.1.2"
description = "sbi-tt-rates is a lightweight, dependency-free Python library for retrieving historical SBI Telegraphic Transfer (TT) buy and sell forex rates. It automatically falls back to the nearest previous published trading day when an exact date is unavailable, making it useful for income tax calculations, foreign asset reporting, accounting, and financial analysis. Not affiliated with SBI. Data may be inaccurate, use at your own risk."
readme = "README.md"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "jdecodes", email = "jaideep_sharma@live.com" }
]

keywords = [
    "sbi",
    "forex",
    "exchange-rate",
    "currency",
    "telegraphic-transfer",
    "historical-rates",
    "india",
    "finance",
    "tax",
    "inr",
    "sbi-tt-rate"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/jdecodes/sbi-tt-rates"
Repository = "https://github.com/jdecodes/sbi-tt-rates"
Issues = "https://github.com/jdecodes/sbi-tt-rates/issues"
Changelog = "https://github.com/jdecodes/sbi-tt-rates/releases"
Documentation = "https://github.com/jdecodes/sbi-tt-rates"
"Data Source" = "https://github.com/sahilgupta/sbi-fx-ratekeeper"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sbi_tt_rates"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: tests that make real network calls (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]