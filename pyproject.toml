[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbi-tt-rates"
version = "0.1.0"
description = "Unofficial lookup for historical SBI TT buy/sell forex rates, with nearest-prior-date fallback. Not affiliated with SBI. Data may be inaccurate, use at your own risk."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "jdecodes", email = "jaideep_sharma@live.com" }
]
keywords = ["sbi", "forex", "tt-rate", "inr", "exchange-rate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/jdecodes/sbi-tt-rates"
"Data Source" = "https://github.com/sahilgupta/sbi-fx-ratekeeper"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
markers = [
    "network: tests that make real network calls (deselect with '-m \"not network\"')",
]
